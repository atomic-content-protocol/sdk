name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome (format + lint)
        run: npx biome ci .
      - name: Build libraries (needed for cross-package types)
        run: npx turbo build --filter='@atomic-content-protocol/*' --filter=acp-server
      - name: Type-check sources and tests
        run: npx turbo lint
      - name: Build website
        run: npx turbo build --filter=acp-website

  build-and-test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npx turbo build --filter='@atomic-content-protocol/*' --filter=acp-server
      - name: Test
        run: npx turbo test --filter='@atomic-content-protocol/*' --filter=acp-server
      - name: Pack publishable packages (catches broken `files`/`exports`)
        if: matrix.node-version == 22
        run: |
          for p in packages/core packages/enrichment packages/mcp apps/cli; do
            (cd "$p" && npm pack --dry-run --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const [p]=JSON.parse(d);console.log(p.name, p.version, p.files.length, "files", (p.size/1024).toFixed(0)+"kB")})')
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high
