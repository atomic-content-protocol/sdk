name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: 22
          cache: npm
          # Deliberately no registry-url: it writes an .npmrc authToken
          # placeholder, and a token entry stops npm using the OIDC identity.
          # registry.npmjs.org is the default anyway.

      # Trusted publishing landed in npm 11.5.1; the runner's bundled npm is
      # usually older. Pin the floor rather than hope.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in packages/core packages/enrichment packages/mcp apps/cli; do
            V=$(node -p "require('./$p/package.json').version")
            if [ "$V" != "$TAG" ]; then echo "::error::$p is $V but tag is $TAG"; exit 1; fi
          done

      - name: Build
        run: npx turbo build --filter='@atomic-content-protocol/*'

      - name: Test
        run: npx turbo test --filter='@atomic-content-protocol/*'

      # Published via npm trusted publishing (OIDC): no NPM_TOKEN, and npm
      # generates the provenance attestation itself, so no --provenance flag.
      # Each package's trusted publisher on npmjs.com must name this repo, the
      # workflow file `publish.yml`, and the `npm` environment used below.
      #
      # Dependency order matters: each package's ^version range must resolve.
      - name: Publish @atomic-content-protocol/core
        run: cd packages/core && npm publish --access public

      - name: Publish @atomic-content-protocol/enrichment
        run: cd packages/enrichment && npm publish --access public

      - name: Publish @atomic-content-protocol/mcp
        run: cd packages/mcp && npm publish --access public

      - name: Publish @atomic-content-protocol/cli
        run: cd apps/cli && npm publish --access public
